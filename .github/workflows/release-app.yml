name: Release app (Tauri)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Dependencias de Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'EcoEstadística ${{ github.ref_name }}'
          releaseDraft: false
      - uses: actions/upload-artifact@v7
        with:
          name: EcoEstadistica-${{ matrix.name }}
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: ''          # evita el paquete "tools", que ya no existe
      - name: Componentes del SDK y NDK
        run: |
          sdkmanager "platform-tools" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - name: Crear el proyecto Android (solo la primera vez)
        working-directory: app
        run: |
          if [ ! -d src-tauri/gen/android ]; then npx tauri android init --ci; fi
      - name: Permiso de ejecución de gradlew
        run: chmod +x app/src-tauri/gen/android/gradlew
      - name: Compilar un APK por arquitectura (depuración)
        working-directory: app
        run: npx tauri android build --apk --debug --split-per-abi --ci
      - name: Reunir los APK con nombres claros
        run: |
          mkdir -p release-apk
          for f in $(find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            arch=$(basename "$(dirname "$(dirname "$f")")")
            cp "$f" "release-apk/EcoEstadistica_${GITHUB_REF_NAME}_android_${arch}.apk"
          done
          ls -l release-apk
      - uses: actions/upload-artifact@v7
        with:
          name: EcoEstadistica-android-apks
          path: release-apk/*.apk
      - name: Adjuntar los APK al release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-apk/*.apk --clobber --repo "$GITHUB_REPOSITORY"
  # Escribe la descripción del release cuando ya terminaron los instaladores.
  # 1) Si existe release-notes/<tag>.md (por ejemplo release-notes/v3.1.0.md), usa ese texto.
  # 2) Si no existe, GitHub genera las notas automáticamente a partir de los commits desde el tag anterior.
  notes:
    needs: [desktop, android]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Descripción del release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f "release-notes/${TAG}.md" ]; then
            cp "release-notes/${TAG}.md" notes.md
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq .body > notes.md
          fi
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name==\"${TAG}\") | .id" | head -1)
          if [ -z "$id" ]; then echo "No se encontró el release de ${TAG}"; exit 1; fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F body=@notes.md
