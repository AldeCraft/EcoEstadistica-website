[package]
name = "ecoestadistica"
version = "3.0.0"
description = "EcoEstadística: estadísticas y registro de residuos (Windows, Linux y Android)"
authors = ["Aldebarán de Jesús Rojas Turrent"]
edition = "2021"
rust-version = "1.85"

[lib]
# El nombre _lib evita un choque de nombres con el binario en Windows.
name = "ecoestadistica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
